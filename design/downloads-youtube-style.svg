<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" font-family="Roboto, Arial, sans-serif">
  <defs>
    <style>
      .bg      { fill: #0d0d0f; }
      .panel   { fill: #16161a; stroke: #2a2a30; stroke-width: 1; }
      .hdr     { fill: #8e8e96; font-size: 11px; letter-spacing: 1.4px; font-weight: 600; }
      .cnt     { fill: #6f6f78; font-size: 11px; }
      .title   { fill: #f2f2f5; font-size: 13.5px; }
      .big     { fill: #f2f2f5; font-size: 22px; font-weight: 600; }
      .sub     { fill: #9a9a9a; font-size: 11.5px; }
      .div     { stroke: #2a2a30; stroke-width: 1; }
      .hair    { stroke: #1c1c1f; stroke-width: 1; }
      .lab     { fill: #6f6f78; font-size: 10.5px; letter-spacing: .8px; }
      .note    { fill: #9aa0a6; font-size: 11.5px; }
      .btn     { fill: #242424; }
      .btnt    { fill: #9a9a9a; font-size: 10.5px; }
      .dot     { fill: #9a9a9a; }
      .foot    { fill: #6f6f78; font-size: 11px; }
      .bullet  { fill: #8e8e96; font-size: 11.5px; }
      .acc     { fill: #3ea6ff; font-size: 11px; }
    </style>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#1b1b21"/>
    </linearGradient>
    <linearGradient id="thumb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e3a44"/>
      <stop offset="100%" stop-color="#191d22"/>
    </linearGradient>
  </defs>

  <rect width="900" height="690" class="bg"/>
  <text x="450" y="32" text-anchor="middle" fill="#f2f2f5" font-size="16" font-weight="600">Downloads screen — YouTube-style redesign</text>
  <text x="450" y="52" text-anchor="middle" class="note">Left: how it looks now. Right: the proposed layout. No emoji, English only.</text>

  <!-- ==================== CURRENT ==================== -->
  <text x="60" y="82" class="lab">CURRENT (v2.07)</text>
  <rect x="40" y="90" width="390" height="480" rx="10" class="panel"/>

  <text x="60" y="120" class="big">Downloads</text>

  <text x="60" y="152" class="hdr">ACTIVE</text>
  <text x="410" y="152" text-anchor="end" class="cnt">1</text>
  <line x1="60" y1="160" x2="410" y2="160" class="div"/>

  <text x="60" y="180" class="title">Big Buck Bunny [1080p]</text>
  <rect x="316" y="167" width="44" height="20" rx="3" class="btn"/>
  <text x="338" y="181" text-anchor="middle" class="btnt">Pause</text>
  <rect x="366" y="167" width="44" height="20" rx="3" class="btn"/>
  <text x="388" y="181" text-anchor="middle" class="btnt">Cancel</text>
  <text x="60" y="200" class="sub">34%  ·  2.1 MB/s  ·  18.4 of 54.0 MB</text>
  <rect x="60" y="208" width="350" height="4" rx="2" fill="#242427"/>
  <rect x="60" y="208" width="119" height="4" rx="2" fill="#34d399"/>

  <text x="60" y="240" class="hdr">COMPLETED</text>
  <text x="410" y="240" text-anchor="end" class="cnt">3</text>
  <line x1="60" y1="248" x2="410" y2="248" class="div"/>

  <text x="60" y="268" class="title">Big Buck Bunny [1080p].mp4</text>
  <text x="60" y="286" class="sub">84.2 MB  ·  Oct 18</text>
  <rect x="366" y="255" width="44" height="20" rx="3" class="btn"/>
  <text x="388" y="269" text-anchor="middle" class="btnt">Delete</text>
  <line x1="60" y1="296" x2="410" y2="296" class="hair"/>

  <text x="60" y="316" class="title">Sintel [720p].mp4</text>
  <text x="60" y="334" class="sub">61.7 MB  ·  Oct 17</text>
  <rect x="366" y="303" width="44" height="20" rx="3" class="btn"/>
  <text x="388" y="317" text-anchor="middle" class="btnt">Delete</text>
  <line x1="60" y1="344" x2="410" y2="344" class="hair"/>

  <text x="60" y="364" class="title">Tears of Steel [audio].m4a</text>
  <text x="60" y="382" class="sub">8.4 MB  ·  Oct 16</text>
  <rect x="366" y="351" width="44" height="20" rx="3" class="btn"/>
  <text x="388" y="365" text-anchor="middle" class="btnt">Delete</text>

  <text x="60" y="416" class="hdr">WATCH LATER</text>
  <text x="410" y="416" text-anchor="end" class="cnt">2</text>
  <text x="60" y="450" class="hdr">PLAYLISTS</text>
  <text x="410" y="450" text-anchor="end" class="cnt">1</text>
  <text x="60" y="484" class="hdr">HISTORY</text>
  <text x="410" y="484" text-anchor="end" class="cnt">5</text>

  <text x="60" y="528" class="foot">Text rows only: no thumbnail, no duration,</text>
  <text x="60" y="544" class="foot">no channel. A Delete button on every row.</text>

  <!-- ==================== PROPOSED ==================== -->
  <text x="490" y="82" class="lab">PROPOSED (v2.08)</text>
  <rect x="470" y="90" width="390" height="480" rx="10" class="panel"/>

  <text x="490" y="120" class="big">Downloads</text>
  <text x="490" y="138" class="sub">1.4 GB used of 8 GB limit</text>
  <text x="840" y="138" text-anchor="end" class="acc">Manage</text>
  <rect x="490" y="145" width="350" height="3" rx="1.5" fill="#242427"/>
  <rect x="490" y="145" width="61" height="3" rx="1.5" fill="#3ea6ff"/>

  <!-- active card -->
  <text x="490" y="172" class="hdr">DOWNLOADING</text>
  <text x="840" y="172" text-anchor="end" class="cnt">1</text>
  <line x1="490" y1="180" x2="840" y2="180" class="div"/>

  <rect x="490" y="188" width="108" height="61" rx="4" fill="url(#thumb)"/>
  <rect x="490" y="188" width="108" height="61" rx="4" fill="#000" opacity="0.55"/>
  <circle cx="544" cy="218" r="14" fill="#000" opacity="0.6"/>
  <rect x="539" y="212" width="3.5" height="12" rx="1" fill="#f2f2f5"/>
  <rect x="546" y="212" width="3.5" height="12" rx="1" fill="#f2f2f5"/>

  <text x="610" y="206" class="title">Big Buck Bunny</text>
  <text x="610" y="224" class="sub">34%  ·  2.1 MB/s  ·  18.4 of 54.0 MB</text>
  <rect x="610" y="232" width="174" height="4" rx="2" fill="#242427"/>
  <rect x="610" y="232" width="59" height="4" rx="2" fill="#34d399"/>

  <circle cx="800" cy="212" r="10.5" fill="#242427"/>
  <rect x="796" y="207" width="3" height="10" rx="1" fill="#f2f2f5"/>
  <rect x="801" y="207" width="3" height="10" rx="1" fill="#f2f2f5"/>
  <circle cx="826" cy="212" r="10.5" fill="#242427"/>
  <path d="M822.5 207.5 L829.5 216.5 M829.5 207.5 L822.5 216.5" stroke="#9a9a9a" stroke-width="1.6" stroke-linecap="round"/>

  <line x1="490" y1="262" x2="840" y2="262" class="hair"/>

  <!-- downloaded list -->
  <text x="490" y="288" class="hdr">DOWNLOADED</text>
  <text x="840" y="288" text-anchor="end" class="cnt">3</text>
  <line x1="490" y1="296" x2="840" y2="296" class="div"/>

  <!-- card 1 -->
  <rect x="490" y="304" width="124" height="70" rx="4" fill="url(#thumb)"/>
  <rect x="572" y="354" width="38" height="16" rx="2" fill="#000" opacity="0.8"/>
  <text x="591" y="365" text-anchor="middle" fill="#f2f2f5" font-size="10">12:34</text>
  <text x="626" y="318" class="title">Big Buck Bunny — 4K</text>
  <text x="626" y="335" class="title">official Blender short film</text>
  <text x="626" y="358" class="sub">Blender Foundation  ·  84 MB</text>
  <circle cx="830" cy="312" r="1.7" class="dot"/>
  <circle cx="830" cy="318" r="1.7" class="dot"/>
  <circle cx="830" cy="324" r="1.7" class="dot"/>
  <circle cx="830" cy="352" r="7" fill="#1e2a22"/>
  <path d="M827 352.5 L829.5 355 L833 349.5" stroke="#34d399" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="490" y1="386" x2="840" y2="386" class="hair"/>

  <!-- card 2 -->
  <rect x="490" y="394" width="124" height="70" rx="4" fill="url(#thumb2)"/>
  <rect x="572" y="444" width="38" height="16" rx="2" fill="#000" opacity="0.8"/>
  <text x="591" y="455" text-anchor="middle" fill="#f2f2f5" font-size="10">8:02</text>
  <text x="626" y="408" class="title">Sintel — official trailer</text>
  <text x="626" y="425" class="title">Durian open movie project</text>
  <text x="626" y="448" class="sub">Blender Foundation  ·  61 MB</text>
  <circle cx="830" cy="402" r="1.7" class="dot"/>
  <circle cx="830" cy="408" r="1.7" class="dot"/>
  <circle cx="830" cy="414" r="1.7" class="dot"/>
  <circle cx="830" cy="442" r="7" fill="#1e2a22"/>
  <path d="M827 442.5 L829.5 445 L833 439.5" stroke="#34d399" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="490" y1="476" x2="840" y2="476" class="hair"/>

  <!-- card 3 (audio) -->
  <rect x="490" y="484" width="124" height="70" rx="4" fill="#1b1b21"/>
  <circle cx="552" cy="519" r="17" fill="#242427"/>
  <path d="M546 524.5 A8 8 0 0 1 558 521.5 L558 512.5 A8 8 0 0 0 546 515.5 Z" fill="#9a9a9a"/>
  <path d="M546 524.5 A8 8 0 0 0 558 521.5 L558 519 A8 8 0 0 1 546 521.5 Z" fill="#9a9a9a"/>
  <rect x="572" y="534" width="38" height="16" rx="2" fill="#000" opacity="0.8"/>
  <text x="591" y="545" text-anchor="middle" fill="#f2f2f5" font-size="10">3:48</text>
  <text x="626" y="498" class="title">Tears of Steel (audio only)</text>
  <text x="626" y="515" class="title">MP3  ·  128 kbps</text>
  <text x="626" y="538" class="sub">Blender Foundation  ·  8 MB</text>
  <circle cx="830" cy="492" r="1.7" class="dot"/>
  <circle cx="830" cy="498" r="1.7" class="dot"/>
  <circle cx="830" cy="504" r="1.7" class="dot"/>
  <circle cx="830" cy="532" r="7" fill="#1e2a22"/>
  <path d="M827 532.5 L829.5 535 L833 529.5" stroke="#34d399" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="490" y="540" class="foot"></text>

  <!-- ==================== NOTES ==================== -->
  <text x="40" y="606" class="lab">WHAT CHANGES</text>
  <text x="40" y="628" class="bullet">1. 16:9 thumbnail with a duration badge — a real frame read from</text>
  <text x="52" y="644" class="bullet">the saved file, so it works with no network at all.</text>
  <text x="40" y="666" class="bullet">2. Title over two lines, then channel · size · quality underneath.</text>

  <text x="470" y="628" class="bullet">3. Three-dot menu per item: Play, Share, Delete — no Delete</text>
  <text x="482" y="644" class="bullet">button on every row.</text>
  <text x="470" y="666" class="bullet">4. Storage used at the top; Watch Later, Playlists and</text>
  <text x="482" y="682" class="bullet">move out — they are not downloads.</text>
</svg>
