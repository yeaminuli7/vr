<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Roboto, Arial, sans-serif">
  <defs>
    <style>
      .bg      { fill: #0d0d0f; }
      .panel   { fill: #16161a; stroke: #2a2a30; stroke-width: 1; }
      .sheet   { fill: #1b1b1d; }
      .hdr     { fill: #8e8e96; font-size: 10.5px; letter-spacing: 1.4px; font-weight: 600; }
      .title   { fill: #f2f2f5; font-size: 13.5px; }
      .big     { fill: #f2f2f5; font-size: 19px; font-weight: 600; }
      .sub     { fill: #9a9a9a; font-size: 11px; }
      .sz      { fill: #9a9a9a; font-size: 11.5px; }
      .div     { stroke: #2a2a30; stroke-width: 1; }
      .hair    { stroke: #232327; stroke-width: 1; }
      .lab     { fill: #6f6f78; font-size: 10.5px; letter-spacing: .8px; }
      .note    { fill: #9aa0a6; font-size: 11.5px; }
      .foot    { fill: #6f6f78; font-size: 11px; }
      .grab    { fill: #4a4a4e; }
      .on      { fill: #3ea6ff; }
      .btnt    { fill: #0d0d0f; font-size: 13px; font-weight: 600; letter-spacing: 1px; }
      .tag     { fill: #3ea6ff; font-size: 9px; font-weight: 600; letter-spacing: .5px; }
    </style>
    <linearGradient id="thumb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#1b1b21"/>
    </linearGradient>
  </defs>

  <rect width="900" height="660" class="bg"/>
  <text x="450" y="30" text-anchor="middle" fill="#f2f2f5" font-size="16" font-weight="600">Download option sheet — YouTube-style redesign</text>
  <text x="450" y="50" text-anchor="middle" class="note">Left: the quality list you get now. Right: the proposed YouTube-style picker. No emoji, English only.</text>

  <!-- ==================== CURRENT ==================== -->
  <text x="60" y="78" class="lab">CURRENT (v2.07)</text>
  <rect x="40" y="86" width="390" height="514" rx="10" class="panel"/>
  <rect x="40" y="300" width="390" height="300" rx="10" class="sheet"/>

  <rect x="192" y="98" width="36" height="4" rx="2" class="grab"/>
  <rect x="60" y="112" width="100" height="56" rx="8" fill="url(#thumb)"/>
  <text x="172" y="130" class="title" font-weight="600">Big Buck Bunny — 4K</text>
  <text x="172" y="148" class="sub">Blender Foundation · 12:34</text>

  <line x1="60" y1="182" x2="410" y2="182" class="div"/>

  <text x="60" y="204" class="hdr">VIDEO · MP4</text>
  <text x="60" y="228" class="title">1080p</text>
  <text x="410" y="228" text-anchor="end" class="sz">84.2 MB</text>
  <line x1="60" y1="238" x2="410" y2="238" class="hair"/>
  <text x="60" y="258" class="title">720p</text>
  <text x="410" y="258" text-anchor="end" class="sz">61.7 MB</text>
  <line x1="60" y1="268" x2="410" y2="268" class="hair"/>
  <text x="60" y="288" class="title">480p</text>
  <text x="410" y="288" text-anchor="end" class="sz">32.1 MB</text>

  <text x="60" y="318" class="hdr">AUDIO · MP3</text>
  <text x="60" y="342" class="title">128 kbps</text>
  <text x="410" y="342" text-anchor="end" class="sz">8.4 MB</text>
  <line x1="60" y1="352" x2="410" y2="352" class="hair"/>
  <text x="60" y="372" class="title">192 kbps</text>
  <text x="410" y="372" text-anchor="end" class="sz">12.6 MB</text>
  <line x1="60" y1="382" x2="410" y2="382" class="hair"/>
  <text x="60" y="402" class="title">320 kbps</text>
  <text x="410" y="402" text-anchor="end" class="sz">21.0 MB</text>

  <text x="60" y="432" class="hdr">SUBTITLES · SRT</text>
  <text x="60" y="456" class="title">English</text>
  <text x="410" y="456" text-anchor="end" class="sz">SRT</text>
  <line x1="60" y1="466" x2="410" y2="466" class="hair"/>
  <text x="60" y="486" class="title">Bengali</text>
  <text x="410" y="486" text-anchor="end" class="sz">SRT</text>

  <line x1="60" y1="512" x2="410" y2="512" class="div"/>
  <text x="60" y="534" class="title">Auto-download</text>
  <text x="352" y="534" text-anchor="end" class="sz">Default: 720p</text>
  <rect x="362" y="524" width="48" height="18" rx="9" fill="#3a3a42"/>
  <circle cx="374" cy="533" r="7" fill="#9a9a9a"/>
  <text x="60" y="556" class="foot">When on, downloads start at the default quality</text>
  <text x="60" y="570" class="foot">without asking. Change it in Settings.</text>

  <text x="60" y="22" class="lab"></text>

  <!-- ==================== PROPOSED ==================== -->
  <text x="490" y="78" class="lab">PROPOSED (v2.08)</text>
  <rect x="470" y="86" width="390" height="514" rx="10" class="panel"/>

  <rect x="622" y="98" width="36" height="4" rx="2" class="grab"/>
  <text x="490" y="126" class="big">Download</text>

  <rect x="490" y="138" width="96" height="54" rx="6" fill="url(#thumb)"/>
  <text x="598" y="156" class="title" font-weight="600">Big Buck Bunny — 4K</text>
  <text x="598" y="174" class="sub">Blender Foundation · 12:34</text>

  <line x1="490" y1="206" x2="840" y2="206" class="div"/>

  <text x="490" y="228" class="hdr">VIDEO QUALITY</text>

  <!-- 1080p selected -->
  <circle cx="500" cy="252" r="8" fill="none" stroke="#3ea6ff" stroke-width="1.6"/>
  <circle cx="500" cy="252" r="4" fill="#3ea6ff"/>
  <text x="518" y="256" class="title">1080p</text>
  <rect x="566" y="244" width="34" height="15" rx="2" fill="#12293c"/>
  <text x="583" y="255" text-anchor="middle" class="tag">BEST</text>
  <text x="840" y="256" text-anchor="end" class="sz">84 MB</text>
  <line x1="490" y1="270" x2="840" y2="270" class="hair"/>

  <circle cx="500" cy="290" r="8" fill="none" stroke="#6f6f78" stroke-width="1.4"/>
  <text x="518" y="294" class="title">720p</text>
  <text x="840" y="294" text-anchor="end" class="sz">61 MB</text>
  <line x1="490" y1="308" x2="840" y2="308" class="hair"/>

  <circle cx="500" cy="328" r="8" fill="none" stroke="#6f6f78" stroke-width="1.4"/>
  <text x="518" y="332" class="title">480p</text>
  <text x="840" y="332" text-anchor="end" class="sz">32 MB</text>
  <line x1="490" y1="346" x2="840" y2="346" class="hair"/>

  <circle cx="500" cy="366" r="8" fill="none" stroke="#6f6f78" stroke-width="1.4"/>
  <text x="518" y="370" class="title">360p</text>
  <text x="840" y="370" text-anchor="end" class="sz">18 MB</text>

  <text x="490" y="404" class="hdr">AUDIO ONLY</text>
  <circle cx="500" cy="428" r="8" fill="none" stroke="#6f6f78" stroke-width="1.4"/>
  <text x="518" y="432" class="title">Audio · 128 kbps</text>
  <text x="840" y="432" text-anchor="end" class="sz">8 MB</text>

  <rect x="490" y="470" width="350" height="40" rx="20" fill="#f2f2f5"/>
  <text x="665" y="495" text-anchor="middle" class="btnt">DOWNLOAD</text>

  <text x="490" y="536" class="foot">Pick a quality, then tap Download. Your last choice</text>
  <text x="490" y="550" class="foot">is remembered as the default.</text>

  <text x="490" y="22" class="lab"></text>

  <!-- ==================== NOTES ==================== -->
  <text x="40" y="626" class="lab">WHAT CHANGES</text>
  <text x="40" y="646" class="note">Radio buttons, a BEST tag on the top quality, and one Download button at the bottom.</text>
  <text x="40" y="660" class="note"></text>
</svg>
